[package]
name = "statuz-core"
version = "0.1.0"
edition = "2021"
description = "Statuz Graph Engine — in-memory topological runtime in Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
blake3 = "1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"