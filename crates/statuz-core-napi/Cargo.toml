[package]
name = "statuz-core-napi"
version = "0.1.0"
edition = "2021"
description = "napi-rs bindings for statuz-core graph engine"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "statuz_core_napi"

[dependencies]
statuz-core = { path = "../statuz-core" }
napi = { version = "2", default-features = false, features = ["napi4", "async"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
napi-build = "2"

[build-dependencies]
napi-build = "2"
