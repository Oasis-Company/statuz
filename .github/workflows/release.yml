name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: windows-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true

  build:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/statuz-core

      - name: Build release
        run: cargo build --release --verbose
        working-directory: crates/statuz-core

      - name: Package binary
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/statuz-core.exe -DestinationPath statuz-core-${{ github.ref_name }}-windows-x64.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: statuz-core-${{ github.ref_name }}-windows-x64.zip