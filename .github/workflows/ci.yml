name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install CLI dependencies
        working-directory: packages/cli
        run: npm install
      - name: Build CLI
        working-directory: packages/cli
        run: npm run build
      - name: Validate example
        working-directory: packages/cli
        run: npm run validate:example
